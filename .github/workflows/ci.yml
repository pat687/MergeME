name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/lead-router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/lead-router/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  stack:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Create .env with random secrets
        run: make init
      - name: Validate both compose profiles
        run: |
          docker compose config --quiet
          docker compose --profile exo config --quiet
      - name: Build and start the router stack
        run: docker compose up -d --build --wait lead-router lead-worker mailpit
      - name: Run the narrated demo end to end
        run: make demo
      - name: Check emails reached the test inbox
        run: |
          count=$(curl -s 'http://localhost:8025/api/v1/messages?limit=1' | python3 -c 'import sys,json; print(json.load(sys.stdin)["total"])')
          echo "emails delivered: $count"
          test "$count" -ge 10
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200 lead-router lead-worker router-db
      - name: Tear down
        if: always()
        run: docker compose down -v
