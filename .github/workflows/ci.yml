name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/lead-router
    # Real Postgres for tests/test_concurrency_postgres.py (threads racing on one lead).
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/lead-router/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -rs   # -rs lists skipped tests, so a missing Postgres can't hide

  stack:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Create .env with random secrets
        run: make init
      - name: Validate both compose profiles
        run: |
          docker compose config --quiet
          docker compose --profile exo config --quiet
      - name: Build and start the router stack
        run: docker compose up -d --build --wait lead-router lead-worker mailpit
      - name: Run the narrated demo end to end
        run: make demo
      - name: Check emails reached the test inbox
        # The worker sends the outbox every 2 seconds, so poll instead of checking once.
        run: |
          for attempt in $(seq 1 30); do
            count=$(curl -sf 'http://localhost:8025/api/v1/messages?limit=1' \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["total"])' 2>/dev/null || echo 0)
            if [ "$count" -ge 10 ]; then echo "emails delivered: $count"; exit 0; fi
            sleep 1
          done
          echo "emails delivered: $count (expected at least 10)"
          exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200 lead-router lead-worker router-db
      - name: Tear down
        if: always()
        run: docker compose down -v
