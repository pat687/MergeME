# Reverse proxy in front of eXo Platform and the ONLYOFFICE document editor.
# Routing follows the pattern in eXo's official Docker setup
# (github.com/exo-docker/exo-community): editor traffic goes to ONLYOFFICE,
# everything else to eXo. Add TLS here (or in front of it) for production.

worker_processes auto;
events { worker_connections 1024; }

http {
  include       mime.types;
  server_tokens off;
  client_max_body_size 0;   # large document uploads

  gzip on;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/json application/javascript application/xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }
  # The Host header including its port; falls back to the server name if a client sends none.
  map $http_host $this_host {
    ""      $host;
    default $http_host;
  }
  map $http_x_forwarded_proto $the_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  upstream exo_app    { server exo:8080; }
  upstream onlyoffice { server onlyoffice:80; }

  server {
    listen 80 default_server;

    # Keep the port (e.g. exoapp.local:8080) so the links eXo builds stay correct
    # when EXO_HTTP_PORT isn't 80.
    proxy_set_header Host              $this_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $the_scheme;
    proxy_set_header X-Forwarded-Host  $this_host;

    # ONLYOFFICE versioned static assets and websocket ("/9.4.0-123/...")
    location ~ ^(/[\d]+\.[\d]+\.[\d]+[.-][^/]+)(/.*)$ {
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://onlyoffice;
    }

    # ONLYOFFICE service endpoints
    location ~ ^/(OfficeWeb|web-apps|sdkjs|sdkjs-plugins|fonts|cache|coauthoring|downloadfile|converter|printfile|healthcheck) {
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://onlyoffice;
    }

    # eXo live updates (CometD websocket)
    location /cometd/cometd {
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://exo_app;
    }

    location / {
      proxy_pass http://exo_app;
    }
  }
}
