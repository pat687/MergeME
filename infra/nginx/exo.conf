# Reverse proxy in front of eXo Platform and the ONLYOFFICE document editor.
# The server block lives in templates/exo-server.conf.template so the listen port can
# follow EXO_HTTP_PORT (the nginx image fills ${...} in templates at startup).
# Routing follows the pattern in eXo's official Docker setup
# (github.com/exo-docker/exo-community): editor traffic goes to ONLYOFFICE,
# everything else to eXo. Add TLS here (or in front of it) for production.

worker_processes auto;
events { worker_connections 1024; }

http {
  include       mime.types;
  server_tokens off;
  client_max_body_size 0;   # large document uploads

  gzip on;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/json application/javascript application/xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }
  # The Host header including its port; falls back to the server name if a client sends none.
  map $http_host $this_host {
    ""      $host;
    default $http_host;
  }
  map $http_x_forwarded_proto $the_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  upstream exo_app    { server exo:8080; }
  upstream onlyoffice { server onlyoffice:80; }

  include /etc/nginx/conf.d/exo-server.conf;
}
