<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Lead Offer</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <h1>Lead offer</h1>
    <span class="tag">For participating attorneys</span>
  </header>
  <div id="view" class="card"><p class="muted">Loading...</p></div>
  <!-- Screen readers hear status changes from here, not the ticking countdown. -->
  <p id="status" class="sr-only" role="status"></p>
  <p class="small muted">You decide whether to take on any matter. Contact details are shared only after you accept.</p>
</main>

<script type="module">
  import { api, fill, h, label, money, phone, pill, when } from "/static/common.js";

  const offerId = location.pathname.split("/").pop();
  // The token lives after '#', which browsers never send to the server (so it can't
  // end up in access logs). Older links used '?t='; move those into the fragment.
  const fromHash = new URLSearchParams(location.hash.slice(1)).get("t");
  const fromQuery = new URLSearchParams(location.search).get("t");
  const token = fromHash || fromQuery || "";
  if (fromQuery) history.replaceState(null, "", `${location.pathname}#t=${encodeURIComponent(token)}`);

  const view = document.getElementById("view");
  const status = document.getElementById("status");
  let announced = null;
  const getOffer = () => api(`/api/v1/offers/${offerId}`, { headers: { "X-Offer-Token": token } });
  let timer = null;
  let retry = null;
  let busy = false;

  function stopTimer() {
    clearInterval(timer);
    clearTimeout(retry);
    timer = retry = null;
  }

  // Count down from the server's own figure, not the browser clock (which may be off).
  // At zero, ask the server once, after a short pause; never in a tight loop.
  function countdown(secondsLeft) {
    const span = h("span", { class: "mono" });
    const deadline = Date.now() + secondsLeft * 1000;
    const tick = () => {
      const secs = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
      span.textContent = `${Math.floor(secs / 60)}m ${String(secs % 60).padStart(2, "0")}s`;
      if (secs === 0) {
        stopTimer();
        retry = setTimeout(load, 1500);  // one pending re-check at a time, never a loop
      }
    };
    stopTimer();
    timer = setInterval(tick, 1000);
    tick();
    return span;
  }

  async function act(action, reason = null) {
    if (busy) return;
    busy = true;
    view.querySelectorAll("button").forEach((b) => (b.disabled = true));
    try {
      render(await api(`/api/v1/offers/${offerId}/${action}`, { method: "POST", body: { token, reason } }));
    } catch (err) {
      const latest = await getOffer().catch(() => null);
      if (latest) render(latest);
      // A double click can make the second request lose to the first; that's not an error.
      if (!(latest && latest.status === "accepted" && action === "accept")) {
        view.prepend(h("p", { class: "error", role: "alert" }, err.message));
      }
    } finally {
      busy = false;
    }
  }

  // Passing can't be undone, so ask first. Cancel (or Escape) really cancels and
  // puts focus back on the Pass button; Enter in the reason box confirms.
  function confirmPass() {
    if (view.querySelector("#pass_reason")) return;
    const reason = h("input", { id: "pass_reason", maxlength: "200", placeholder: "e.g. conflict, too busy" });
    const confirm = () => act("decline", reason.value.trim() || null);
    const cancel = () => {
      box.remove();
      view.querySelector("#pass")?.focus();
    };
    const box = h("div", {
      class: "notice", role: "group", "aria-label": "Confirm pass",
      onkeydown: (e) => {
        if (e.key === "Escape") { e.preventDefault(); cancel(); }
        if (e.key === "Enter" && e.target === reason) { e.preventDefault(); confirm(); }
      },
    },
      h("label", { for: "pass_reason" }, "Why are you passing? (optional)"),
      reason,
      h("div", { class: "actions" },
        h("button", { class: "danger", onclick: confirm }, "Yes, pass on this lead"),
        h("button", { class: "secondary", onclick: cancel }, "Cancel")));
    view.querySelector(".actions")?.after(box);
    reason.focus();
  }

  function render(o) {
    if (o.status !== "pending") stopTimer();
    if (o.status !== announced) {
      announced = o.status;
      status.textContent = o.notice;
    }
    const facts = [
      ["Practice area", label(o.practice_area)],
      ["Location", `${o.zip_code}, ${o.state}`],
      ["Quality", `Tier ${o.tier} (${o.score}/100)`],
      ["Price", money(o.price_cents)],
      ["How it's offered", label(o.model)],
    ];
    fill(view,
      h("div", { class: "toolbar" }, pill(o.status), o.status === "pending" && o.seconds_left !== null
        ? h("span", { class: "small muted" }, "Time left: ", countdown(o.seconds_left)) : null),
      h("p", {}, o.notice),
      h("div", { class: "facts" }, facts.map(([k, v]) => h("div", { class: "fact" }, h("div", { class: "k" }, k), h("div", { class: "v" }, v)))),
      o.price_note ? h("p", { class: "small muted", id: "price_note" }, o.price_note) : null,
      h("h3", {}, "What they told us"),
      h("p", {}, `"${o.summary}"`),
      o.contact ? h("div", { class: "notice" },
        h("strong", {}, o.contact.name), h("br"),
        `Phone: ${phone(o.contact.phone)}`, h("br"),
        `Email: ${o.contact.email}`, h("br"),
        `Incident date: ${o.contact.incident_date ?? "not given"}`,
        h("p", {}, o.contact.description)) : null,
      o.status === "pending" ? h("div", { class: "actions" },
        h("button", { onclick: () => act("accept") }, "Accept lead"),
        h("button", { class: "secondary", id: "pass", onclick: confirmPass }, "Pass")) : null,
      o.expires_at ? h("p", { class: "small muted" }, `Offer deadline: ${when(o.expires_at)}`) : null,
    );
  }

  async function load() {
    try {
      render(await getOffer());
    } catch (err) {
      stopTimer();
      fill(view, h("p", { class: "error" }, err.message));
      announced = null;  // a later successful load announces its status again
      status.textContent = err.message;  // screen readers hear the failure, not silence
    }
  }
  load();
</script>
</body>
</html>
